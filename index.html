<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محطة دنيا للوقود - النظام المحاسبي المتكامل</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
          --bg-dark: #121824;
          --card-bg: #1e293b;
          --accent-orange: #f97316;
          --accent-blue: #3b82f6;
          --text-color: #f8fafc;
          --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body.bg-dark-mode {
          background-color: var(--bg-dark);
          color: var(--text-color);
          font-family: 'Cairo', sans-serif;
          padding-bottom: 70px;
        }
        /* الشريط الحي العلوي */
        .live-dashboard-bar {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          gap: 8px;
          padding: 10px;
          background: var(--card-bg);
          border-bottom: 2px solid var(--accent-orange);
        }
        .card-metric {
          background: #0f172a;
          padding: 8px;
          border-radius: 6px;
          font-size: 13px;
          text-align: center;
        }
        .card-metric.highlight { border: 1px solid var(--accent-orange); }
        .card-metric span { display: block; font-weight: bold; color: var(--accent-orange); font-size: 15px; }
        
        /* المحتوى والتبويبات (SPA) */
        .app-container { padding: 15px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        h2 { font-size: 18px; margin-bottom: 15px; color: var(--accent-blue); border-bottom: 1px solid var(--border-color); padding-bottom: 5px; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; margin-bottom: 5px; }
        .form-group input {
          width: 100%;
          padding: 10px;
          background: var(--card-bg);
          border: 1px solid var(--border-color);
          color: var(--text-color);
          border-radius: 6px;
          font-size: 16px;
        }
        
        .btn-primary {
          width: 100%;
          padding: 12px;
          background: var(--accent-orange);
          color: #fff;
          border: none;
          border-radius: 6px;
          font-weight: bold;
          font-size: 16px;
          cursor: pointer;
          margin-top: 10px;
        }
        
        /* أزرار المصاريف السريعة */
        .quick-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; }
        .chip {
          background: var(--card-bg);
          border: 1px solid var(--accent-blue);
          color: var(--text-color);
          padding: 8px 12px;
          border-radius: 20px;
          font-size: 13px;
          cursor: pointer;
        }

        /* شريط التنقل السفلي */
        .bottom-nav {
          position: fixed;
          bottom: 0; left: 0; right: 0;
          background: #0f172a;
          display: flex;
          justify-content: space-around;
          padding: 10px 0;
          border-top: 1px solid var(--border-color);
          z-index: 1000;
        }
        .bottom-nav button {
          background: none;
          border: none;
          color: var(--text-color);
          font-size: 12px;
          cursor: pointer;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 3px;
        }
        .bottom-nav button.active { color: var(--accent-orange); }
      </style>
</head>
<body class="bg-dark-mode">

    <!-- الشريط الحي (اللوحة الحية لمتابعة الورديات) -->
    <header class="live-dashboard-bar">
        <div class="card-metric">مبيعات اليوم <span id="live-sales">0 لتر</span></div>
        <div class="card-metric">المصاريف <span id="live-expenses">0 ل.س</span></div>
        <div class="card-metric">ديون الآجل <span id="live-debts">0 ل.س</span></div>
        <div class="card-metric highlight">الصافي النقدي الفعلي <span id="live-net">0 ل.س</span></div>
    </header>

    <!-- الهيكل البرمجي للصفحة الواحدة (SPA) -->
    <main class="app-container">
        
        <!-- تبويب العدادات والمضخات -->
        <section id="tab-meters" class="tab-content active">
            <h2>إدارة العدادات وسحب الورديات</h2>
            <form id="shift-form">
                <div class="form-group">
                    <label>رقم قراءة العداد الحالية:</label>
                    <input type="number" id="current-reading" placeholder="أدخل القراءة الحالية" required>
                </div>
                <div class="form-group">
                    <label>كمية المعايرة والالفحص المسترجعة:</label>
                    <input type="number" id="calibration-qty" value="0">
                </div>
                <button type="submit" class="btn-primary">حفظ الوردية (استجابة فورية)</button>
            </form>
        </section>

        <!-- تبويب المصاريف -->
        <section id="tab-expenses" class="tab-content">
            <h2>إثبات المصاريف التشغيلية</h2>
            <div class="quick-chips">
                <button class="chip" onclick="quickExpense('صيانة طارئة', 25000)">🔧 صيانة طارئة</button>
                <button class="chip" onclick="quickExpense('ضيافة وضيافات', 10000)">☕ ضيافة</button>
                <button class="chip" onclick="quickExpense('تشغيل مولدة', 50000)">⚡ مولدة</button>
            </div>
            <div class="form-group">
                <label>بيان المصروف:</label>
                <input type="text" id="exp-desc" placeholder="مثال: شراء قطع غيار">
            </div>
            <div class="form-group">
                <label>المبلغ (ل.س):</label>
                <input type="number" id="exp-amount" placeholder="0">
            </div>
            <button type="button" class="btn-primary" onclick="saveCustomExpense()">حفظ المصروف</button>
        </section>

        <!-- تبويب الخزانات والسيخة -->
        <section id="tab-tanks" class="tab-content">
            <h2>جرد الخزانات الأرضية (السيخة)</h2>
            <p style="font-size: 13px; color: #94a3b8; margin-bottom: 10px;">النظام يقوم بالخصم اللحظي للمبيعات من رصيد الخزانات.</p>
            <div class="form-group">
                <label>اختر الخزان:</label>
                <input type="text" value="خزان بنزين 1 (الرئيسي)" disabled style="opacity: 0.7;">
            </div>
            <div class="form-group">
                <label>قياس السيخة الفعلي (سم أو لتر):</label>
                <input type="number" id="dip-reading" placeholder="أدخل القياس الحالي">
            </div>
            <button type="button" class="btn-primary" onclick="alert('تم تسجيل قراءة السيخة وفحص العجز بنجاح.')">مطابقة وجرد المخزون</button>
        </section>

        <!-- تبويب الإعدادات والتقارير -->
        <section id="tab-settings" class="tab-content">
            <h2>الإعدادات والتقارير اليومية</h2>
            <button type="button" class="btn-primary" style="background:var(--accent-blue); margin-bottom:10px;" onclick="alert('جاري إعداد وإنشاء تقرير الوردية بصيغة PDF...')">تصدير تقرير الوردية PDF</button>
            <button type="button" class="btn-primary" style="background:#ef4444;" onclick="if(confirm('هل أنت متأكد من رغبتك في استخدام زر الطوارئ؟')) alert('تم تفعيل وضع الطوارئ وتصفير البيانات المحلية المؤقتة.');">زر الطوارئ المؤمّن</button>
        </section>
    </main>

    <!-- شريط التنقل السفلي للـ SPA -->
    <nav class="bottom-nav">
        <button onclick="switchTab('meters', this)" class="active">
            <span>⛽</span> العدادات
        </button>
        <button onclick="switchTab('expenses', this)">
            <span>💵</span> المصاريف
        </button>
        <button onclick="switchTab('tanks', this)">
            <span>🛢️</span> الخزانات
        </button>
        <button onclick="switchTab('settings', this)">
            <span>⚙️</span> الإعدادات
        </button>
    </nav>

    <!-- المنطق البرمجي المدمج وربط Firebase السحابي -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, enableIndexedDbPersistence, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات اتصال Firebase (يتم استبدالها ببيانات المشروع الخاصة بك)
        const firebaseConfig = {
          apiKey: "YOUR_API_KEY",
          authDomain: "dunya-fuel.firebaseapp.com",
          projectId: "dunya-fuel",
          storageBucket: "dunya-fuel.appspot.com",
          messagingSenderId: "SENDER_ID",
          appId: "APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // تفعيل العمل بدون إنترنت والتخزين المؤقت المحلي
        enableIndexedDbPersistence(db).catch((err) => {
          console.warn("ميزة العمل دون إنترنت نشطة مسبقاً أو غير مدعومة كلياً في هذا المتصفح.");
        });

        // التنقل السلس بين أقسام الـ SPA
        window.switchTab = function(tabName, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.bottom-nav button').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
            btnElement.classList.add('active');
        };

        // إدارة حفظ الوردية مع الاستجابة الفورية (Optimistic UI)
        document.getElementById('shift-form')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const currentReading = document.getElementById('current-reading').value;
            const calibration = document.getElementById('calibration-qty').value;

            const shiftPayload = {
                currentReading: Number(currentReading),
                calibration: Number(calibration),
                timestamp: serverTimestamp()
            };

            // استجابة فورية للمستخدم دون انتظار بطء شبكة الإنترنت
            alert("تم حفظ الوردية محلياً بنجاح، وجاري المزامنة السحابية في الخلفية.");
            
            try {
                await addDoc(collection(db, "shifts"), shiftPayload);
            } catch (error) {
                console.log("تم الحفظ محلياً وسيتم مزامنة البيانات تلقائياً فور توفر الاتصال.");
            }
        });

        // دوال المصاريف السريعة
        window.quickExpense = function(desc, amount) {
            alert(`تم إدراج مصروف (${desc}) بقيمة ${amount} ل.س بنجاح.`);
        };

        window.saveCustomExpense = function() {
            const desc = document.getElementById('exp-desc').value;
            const amount = document.getElementById('exp-amount').value;
            if(!desc || !amount) {
                alert("يرجى إدخال البيان والمبلغ بشكل صحيح.");
                return;
            }
            alert(`تم حفظ المصروف التشغيلي بنجاح.`);
            document.getElementById('exp-desc').value = '';
            document.getElementById('exp-amount').value = '';
        };
    </script>
</body>
</html>
